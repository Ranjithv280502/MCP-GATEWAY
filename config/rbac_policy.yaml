roles:
  admin:
    allowed_tools: ["*"]
    description: Full access to all gateway tools

  developer:
    allowed_tools:
      - "schema.*"
      - "data.search_*"
      - "data.get_*"
      - "data.create_*"
      - "workflow.send_*"
      - "workflow.trigger_webhook"
    description: Schema validation, data read/write, basic workflow actions

  analyst:
    allowed_tools:
      - "analytics.*"
      - "data.search_*"
      - "data.get_*"
      - "data.count_records"
    description: Analytics, metrics, and read-only data access

  operator:
    allowed_tools:
      - "workflow.*"
      - "data.bulk_*"
      - "analytics.generate_report"
    description: Workflow automation and operational tasks

