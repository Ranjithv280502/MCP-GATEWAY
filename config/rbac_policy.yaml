roles:
  admin:
    allowed_tools: ["*"]
    description: Full access to all gateway tools

  engineer:
    allowed_tools:
      - "fs.*"
      - "fetch.*"
      - "github.search_*"
      - "github.get_*"
      - "github.create_issue"
      - "github.create_pull_request"
      - "github.list_*"
      - "postgres.query"
      - "schema.*"
      - "data.search_*"
      - "data.get_*"
    description: Read/write code, files, GitHub issues, and data search

  sre:
    allowed_tools:
      - "fs.read_*"
      - "fs.list_*"
      - "fetch.*"
      - "postgres.query"
      - "analytics.*"
      - "workflow.run_*"
      - "workflow.get_*"
    description: Read-only infra, metrics, and workflow status

  readonly:
    allowed_tools:
      - "fs.read_*"
      - "fs.list_*"
      - "fetch.fetch"
      - "github.search_*"
      - "github.get_*"
      - "github.list_*"
      - "data.search_*"
      - "data.get_*"
      - "analytics.generate_report"
    description: Read-only access across file, GitHub, and data tools

  researcher:
    allowed_tools:
      - "fs.read_*"
      - "fs.list_*"
      - "data.search_*"
      - "data.get_*"
    description: Swarm researcher — read files and search policy corpus

  analyst:
    allowed_tools:
      - "fs.read_*"
      - "fs.list_*"
      - "postgres.query"
      - "data.get_*"
    description: Swarm analyst — SQL + file cross-check

  executor:
    allowed_tools:
      - "github.create_issue"
      - "github.list_*"
      - "data.create_*"
      - "data.patch_*"
    description: Swarm executor — GitHub issues and data writes

