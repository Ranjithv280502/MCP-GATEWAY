gateway:
  name: mcp-gateway
  semantic_top_k: 8
  namespace_separator: "."

downstream_servers:
  - id: filesystem
    command: python
    args: ["-m", "servers.filesystem_local.server"]
    namespace: fs
    optional: false

  - id: fetch
    command: python
    args: ["-m", "mcp_server_fetch"]
    namespace: fetch
    optional: true

  - id: github
    command: python
    args: ["-m", "servers.github_sim.server"]
    namespace: github
    optional: false

  - id: postgres
    command: python
    args: ["-m", "servers.postgres_sim.server"]
    namespace: postgres
    optional: false

  - id: gitlab
    command: python
    args: ["-m", "servers.gitlab_sim.server"]
    namespace: gitlab
    optional: false

  - id: schema_validation
    command: python
    args: ["-m", "servers.schema_validation.server"]
    namespace: schema
    optional: false

  - id: data_ops
    command: python
    args: ["-m", "servers.data_ops.server"]
    namespace: data
    optional: false

  - id: analytics
    command: python
    args: ["-m", "servers.analytics.server"]
    namespace: analytics
    optional: false

  - id: workflow
    command: python
    args: ["-m", "servers.workflow.server"]
    namespace: workflow
    optional: false
